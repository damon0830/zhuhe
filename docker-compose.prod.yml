# ============================================================
# 珠合（ZhuHe）生产部署配置
# 
# 在服务器上使用以下命令启动：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 首次部署（建表 + 导入数据 + 创建管理员）：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py seed_data
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm backend python manage.py createsuperuser
# ============================================================
version: "3.9"

services:
  # ======================== PostgreSQL ========================
  postgres:
    image: postgres:16-alpine
    container_name: zhuhe-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhuhe}
      POSTGRES_USER: ${POSTGRES_USER:-zhuhe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhuhe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Redis =============================
  redis:
    image: redis:7-alpine
    container_name: zhuhe-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ======================== Django Backend ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhuhe-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.prod
    environment:
      - DJANGO_SETTINGS_MODULE=zhuhe.settings
      - DATABASE_URL=postgres://${POSTGRES_USER:-zhuhe}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zhuhe}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_DEBUG=False
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        gunicorn zhuhe.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
      "

  # ======================== Nuxt Frontend =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhuhe-frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.prod
    environment:
      - NUXT_PUBLIC_API_BASE=/api
      - NUXT_PORT=3000
      - NUXT_HOST=0.0.0.0
    depends_on:
      - backend

  # ======================== Nginx =============================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: zhuhe-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - backend_static:/static:ro
      - backend_media:/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro        # 放 SSL 证书（稍后配置）
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media:
